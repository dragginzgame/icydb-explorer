[package]
name = "icydb-explorer"
version = "0.1.0"
description = "A read-only Tauri desktop app for browsing icydb databases living inside Internet Computer canisters"
authors = ["rem.codes"]
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "icydb_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
# Hands the "view this release" link to the OS browser. Scoped in
# `capabilities/default.json` to this repository's own URLs — an unscoped grant
# would let anything running in the webview ask the OS to open any address.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candid = "0.10"
ic-agent = "0.48"
icydb = { workspace = true }
tokio = { version = "1", features = ["sync", "process", "time"] }
# `join_all`, for sweeping a pool concurrently. Already in the tree transitively
# via tauri/ic-agent; declared here because relying on a transitive dependency
# for a direct `use` is how a build breaks on someone else's upgrade.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

