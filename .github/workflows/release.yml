# Standalone builds for macOS, Windows and Linux.
#
# Runs on a `v*` tag, and on manual dispatch for a dry run that produces the same
# artifacts without creating a release — so the workflow itself can be tested
# without cutting a version.
#
# The release is left as a **draft**. Publishing is a person's decision: these
# artifacts are unsigned (see the note in `build`), and someone should read that
# before the download link is public.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only what is needed: creating the release and uploading to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything cheap and deterministic, once, before three platforms spend twenty
  # minutes each. A release that fails its own test suite is worse than no release,
  # and finding out on the third platform wastes the first two.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The Rust crate links against webkit2gtk even to compile its tests.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          # Vite 7 needs 20.19+/22.12+; 22 is the current LTS.
          node-version: 22
          cache: npm

      # `rust-toolchain.toml` pins the channel, so clippy and its lint set are
      # pinned too — which is why `-D warnings` below cannot break a release on
      # somebody else's schedule. `rustup show` installs that pinned toolchain;
      # naming a channel here instead would be a fiction, since the toolchain
      # file overrides it for every cargo invocation anyway.
      - name: Install the pinned Rust toolchain
        run: rustup show
      # No `workspaces:` input. The cargo workspace root is the repo root, where
      # both `Cargo.lock` and the shared `target/` live — `src-tauri` is a member
      # of that workspace, not a workspace itself, and has no lockfile of its own.
      # Naming it here pointed the cache at a directory with nothing to hash.
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The tag and the version inside the bundle have to agree. Without this a
      # `v0.2.0` release can contain an app that reports 0.1.0 in its About box and
      # its .deb metadata, which is the kind of wrong that is discovered months
      # later by someone debugging the wrong version.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tagged, but src-tauri/tauri.conf.json declares $declared"
            exit 1
          fi
          echo "version $declared matches tag $GITHUB_REF_NAME"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      # `--manifest-path` rather than a bare `cargo test`: the workspace also holds
      # the `fixture` canister crates, which are built for wasm and are not part of
      # what ships here.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: verify
    strategy:
      # One platform failing should not deny the other two. A partial draft release
      # is still useful, and the gap is visible in it.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two Mac downloads: a reader should not
          # have to know which chip they have.
          - platform: macos-latest
            args: --target universal-apple-darwin
            # Space-separated: this is passed straight to `rustup target add`,
            # which takes a list of arguments rather than one comma-joined string.
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            label: macos
          # Deliberately not `ubuntu-latest`. The binary links the glibc of the
          # runner it was built on, so building on the newest Ubuntu produces
          # something that refuses to start on any older distro. 22.04 is the
          # oldest image with webkit2gtk-4.1, which Tauri 2 requires.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            label: linux
          - platform: windows-latest
            args: ""
            rust-targets: ""
            label: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Deliberately not `dtolnay/rust-toolchain@stable` with a `targets:` input.
      # `rust-toolchain.toml` pins 1.96.0, and that file wins for every cargo
      # invocation in this directory — so installing targets into `stable` left
      # the toolchain that actually builds holding only its own host target, and
      # the macOS leg died with "Target x86_64-apple-darwin is not installed
      # (installed targets: aarch64-apple-darwin)". Adding the targets to the
      # pinned toolchain is the whole fix; `rustup show` materialises it first.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Add cross-compilation targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - run: npm ci

      # `tauri-action` runs `beforeBuildCommand` from tauri.conf.json, so the
      # frontend is built here rather than in a step of its own.
      #
      # No Apple signing variables here, and that omission is deliberate.
      #
      # They were originally wired up in advance, on the assumption that Tauri
      # would skip signing while the secrets did not exist yet. It does not: a
      # GitHub secret that has never been set still defines the environment
      # variable, as an empty string, and Tauri reads a defined `APPLE_CERTIFICATE`
      # as "sign this". The macOS leg then failed in the bundler with
      # `SecKeychainItemImport: One or more parameters ... were not valid` after a
      # successful six-minute compile — a confusing failure a long way from its
      # cause. Add these only alongside real certificates:
      #
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #
      # Until then every artifact here is UNSIGNED: macOS Gatekeeper refuses the
      # .dmg without an explicit right-click → Open, and Windows shows a
      # SmartScreen warning. That is a property of these builds rather than a bug
      # in them, and the draft release below is where it is written down.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on a manual run, which is what stops a dry run from creating a
          # release. The artifacts still get uploaded by the step below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: icydb Explorer ${{ github.ref_name }}
          releaseBody: |
            Standalone builds of icydb Explorer, a read-only browser for the icydb
            databases inside Internet Computer canisters.

            **These builds are not code-signed.** On macOS, right-click the app and
            choose Open the first time — Gatekeeper will otherwise refuse it. On
            Windows, SmartScreen will warn before running it.

            The app reads a project's `.icp/` directory and queries canisters
            through icydb's read-only SQL endpoint. It never issues an update call.
            Requirements, including the icydb version it is built against, are on
            its first screen.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # So a manual dispatch is a real rehearsal: the same builds, downloadable,
      # without a release existing. Without this a dry run would prove the build
      # compiles and then throw the result away.
      - name: Upload artifacts for a dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: icydb-explorer-${{ matrix.label }}
          if-no-files-found: error
          # The workspace root, not `src-tauri/target`. `src-tauri` is a member of
          # the root workspace, so cargo writes the shared target directory beside
          # the root `Cargo.toml`. A local universal build was measured writing to
          # `target/universal-apple-darwin/release/bundle/`; the `src-tauri/`-prefixed
          # paths this step started with matched nothing at all.
          #
          # Named by extension rather than `bundle/**/*`, which also swept up the
          # dmg builder's scratch (`bundle_dmg.sh`, a copy of `icon.icns`) and
          # presented it beside the installers as though it were something to
          # download. The union covers all three platforms; `if-no-files-found`
          # judges the search as a whole, so each runner matching only its own
          # subset is expected and not an error.
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
